# SonarQube project configuration for BjjSM
sonar.projectKey=bjjsm
sonar.projectName=BjjSM
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Source directories, coverage, and analysis exclusions
sonar.sources=src
sonar.tests=tests
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
sonar.exclusions=**/bin/**,**/obj/**,**/wwwroot/lib/**,**/Migrations/**,**/*.g.cs,**/*.Designer.cs
sonar.coverage.exclusions=**/tests/**,**/*Tests/**,**/*Tests.cs,**/Migrations/**,**/Program.cs,**/DependencyInjection.cs,**/*.razor
sonar.cpd.exclusions=**/Migrations/**,**/Program.cs,**/CurriculumThemePresets.cs,**/SpacedRepetitionPresets.cs
sonar.cs.analyzeRazorCode=true
